name: Build Android APK

on:
  push:
    branches: [ "claude/video-downloader-app-nehmkl" ]
    paths: [ "video-downloader/**", ".github/workflows/android-build.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-downloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-debug-apk
          path: video-downloader/app/build/outputs/apk/debug/*.apk
